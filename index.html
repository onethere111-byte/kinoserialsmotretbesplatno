<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CinemaHub — Бесплатный кинотеатр без рекламы</title>
<script src="https://tailwindcss.com"></script>
<style>
body { background: #08090c; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
.glass { background: rgba(18, 20, 28, 0.88); backdrop-filter: blur(14px); }
.no-scrollbar::-webkit-scrollbar { display: none; }
</style>
</head>
<body class="antialiased">
<div id="toast" class="fixed bottom-4 right-4 z-[100] bg-emerald-600 text-white text-xs font-bold px-4 py-3 rounded-xl shadow-2xl hidden"></div>

<nav class="fixed top-0 w-full z-40 glass border-b border-white/10">
<div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
<a href="#" onclick="resetCat()" class="text-xl sm:text-2xl font-black tracking-tight text-red-600">CINEMA<span class="text-white">HUB</span></a>
<div class="flex items-center gap-2">
<input id="search" oninput="render()" placeholder="Поиск (Айда, 90-е...)" class="bg-white/10 border border-white/10 rounded-full px-3.5 py-1.5 text-xs sm:text-sm w-32 sm:w-56 outline-none focus:border-red-500">
<a id="donateNav" href="#" target="_blank" onclick="trackMoneyClick(event)" class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-bold px-3 py-2 rounded-xl">💎 Донат</a>
<button onclick="openAuthOrPanel()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-lg shadow-red-600/30">🔐 DEV</button>
</div>
</div>
</nav>

<header class="pt-16">
<div class="relative h-[56vh] min-h-[380px] bg-zinc-950 overflow-hidden flex items-end">
<img id="heroImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-65">
<div class="absolute inset-0 bg-gradient-to-t from-[#08090c] via-[#08090c]/60 to-transparent"></div>
<div class="relative z-10 max-w-7xl mx-auto px-4 pb-8 w-full">
<span class="bg-red-600 text-[10px] font-black uppercase px-2.5 py-1 rounded">ХИТ 2026 • 0% РЕКЛАМЫ</span>
<h1 id="heroTitle" class="text-3xl sm:text-5xl font-black mt-2 mb-2">Айда!</h1>
<p id="heroDesc" class="text-xs sm:text-sm text-gray-300 max-w-xl mb-5 line-clamp-2"></p>
<button onclick="playHero()" class="bg-red-600 hover:bg-red-700 font-bold px-6 py-3 rounded-xl text-sm shadow-lg">▶ Смотреть бесплатно</button>
</div>
</div>
</header>

<div class="max-w-7xl mx-auto px-4 pt-4 flex gap-2 overflow-x-auto no-scrollbar">
<button onclick="setCat('all')" class="px-4 py-1.5 rounded-full text-xs font-bold bg-red-600 whitespace-nowrap">Все</button>
<button onclick="setCat('90-е и Улица')" class="px-4 py-1.5 rounded-full text-xs font-bold bg-white/10 text-amber-400 whitespace-nowrap">🔥 90-е и Пацанские</button>
<button onclick="setCat('Криминал')" class="px-4 py-1.5 rounded-full text-xs font-bold bg-white/10 whitespace-nowrap">🔫 Криминал</button>
<button onclick="setCat('Сериал')" class="px-4 py-1.5 rounded-full text-xs font-bold bg-white/10 whitespace-nowrap">📺 Сериалы</button>
<button onclick="setCat('Фильм')" class="px-4 py-1.5 rounded-full text-xs font-bold bg-white/10 whitespace-nowrap">🎬 Фильмы</button>
</div>

<div id="promoBanner" class="max-w-7xl mx-auto px-4 pt-5 hidden">
<div class="bg-gradient-to-r from-amber-500/15 to-red-600/15 border border-amber-500/30 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
<div>
<p id="promoTitle" class="text-sm font-extrabold text-amber-400"></p>
<p id="promoSub" class="text-xs text-gray-300"></p>
</div>
<a id="promoLink" href="#" target="_blank" onclick="trackMoneyClick()" class="bg-amber-500 text-black font-extrabold text-xs px-4 py-2 rounded-xl">Перейти →</a>
</div>
</div>

<main class="max-w-7xl mx-auto px-4 py-6">
<div class="flex justify-between items-center mb-4">
<h2 id="catHeader" class="text-xl font-extrabold">Каталог кинотеатра</h2>
<span id="countBadge" class="text-xs text-gray-400"></span>
</div>
<div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
</main>

<div id="playerModal" class="fixed inset-0 z-50 hidden bg-black/95 flex items-center justify-center p-3">
<div class="w-full max-w-4xl bg-[#11131a] rounded-2xl border border-white/15 overflow-hidden">
<div class="flex justify-between items-center px-4 py-3 border-b border-white/10">
<div>
<h3 id="pTitle" class="font-bold text-sm sm:text-base"></h3>
<p id="pMeta" class="text-xs text-gray-400"></p>
</div>
<button onclick="closePlayer()" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-red-600 text-xl font-bold">&times;</button>
</div>
<div class="aspect-video bg-black relative flex items-center justify-center">
<video id="mp4Player" controls playsinline class="w-full h-full hidden"></video>
<div id="ytBox" class="w-full h-full relative hidden">
<img id="ytThumb" class="w-full h-full object-cover opacity-70">
<div class="absolute inset-0 flex flex-col items-center justify-center bg-black/40 p-4 text-center">
<a id="ytBtn" href="#" target="_blank" class="w-16 h-16 rounded-full bg-red-600 flex items-center justify-center text-2xl shadow-2xl mb-3">▶</a>
<span id="ytLabel" class="bg-black/80 px-4 py-2 rounded-xl text-xs font-bold border border-white/15">Смотреть в HD</span>
</div>
</div>
</div>
<div class="p-4 space-y-3">
<p id="pDesc" class="text-xs text-gray-300"></p>
<div id="epList" class="flex flex-wrap gap-2"></div>
</div>
</div>
</div>

<div id="loginModal" class="fixed inset-0 z-50 hidden bg-black/90 flex items-center justify-center p-4">
<div class="w-full max-w-sm bg-[#12141c] rounded-2xl border border-white/15 p-6 space-y-4">
<div class="flex justify-between items-center">
<h3 class="font-black text-lg text-red-500">🔐 Вход в DEV STUDIO</h3>
<button onclick="document.getElementById('loginModal').classList.add('hidden')" class="text-gray-400 text-xl">&times;</button>
</div>
<p class="text-xs text-gray-400">Введи пароль Владельца или ключ доступа Админа / Модератора.</p>
<input type="password" id="passInput" placeholder="Пароль доступа..." class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-red-500">
<button onclick="loginAttempt()" class="w-full bg-red-600 hover:bg-red-700 font-bold py-2.5 rounded-xl text-sm">Войти в панель</button>
<p class="text-[11px] text-gray-500 text-center">Стандартный пароль владельца: <b class="text-gray-300">boss777</b></p>
</div>
</div>

<div id="devModal" class="fixed inset-0 z-50 hidden bg-black/95 overflow-y-auto p-3">
<div class="max-w-4xl mx-auto bg-[#12141c] rounded-2xl border border-white/15 p-5 my-4 space-y-5">
<div class="flex flex-wrap justify-between items-center border-b border-white/10 pb-3 gap-2">
<div>
<h2 class="font-black text-lg flex items-center gap-2">⚙️ DEV STUDIO <span id="roleBadge" class="text-[10px] bg-red-600 px-2 py-0.5 rounded uppercase">OWNER</span></h2>
<p id="roleHint" class="text-xs text-gray-400"></p>
</div>
<div class="flex gap-2">
<button onclick="logoutDev()" class="text-xs bg-white/10 px-3 py-1.5 rounded-lg">Выйти</button>
<button onclick="document.getElementById('devModal').classList.add('hidden')" class="w-8 h-8 bg-red-600 rounded-lg font-bold">&times;</button>
</div>
</div>

<div class="flex gap-2 overflow-x-auto no-scrollbar text-xs font-bold">
<button onclick="showTab('add')" class="px-3.5 py-2 rounded-lg bg-red-600">➕ Добавить контент</button>
<button onclick="showTab('list')" class="px-3.5 py-2 rounded-lg bg-white/10">🎬 База (<span id="dbCount">0</span>)</button>
<button id="tabStaffBtn" onclick="showTab('staff')" class="px-3.5 py-2 rounded-lg bg-white/10">👑 Админы и Модеры</button>
<button id="tabMoneyBtn" onclick="showTab('money')" class="px-3.5 py-2 rounded-lg bg-amber-500/20 text-amber-400">💰 Вывод и Бабки</button>
</div>

<form id="tab-add" onsubmit="addMovie(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-black/30 p-4 rounded-xl">
<input id="mTitle" required placeholder="Название (напр. Айда! 2 сезон)" class="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-xs">
<select id="mType" class="bg-[#1a1d28] border border-white/10 rounded-lg px-3 py-2 text-xs">
<option value="Сериал">Сериал</option>
<option value="Фильм">Фильм</option>
</select>
<select id="mCat" class="bg-[#1a1d28] border border-white/10 rounded-lg px-3 py-2 text-xs">
<option value="90-е и Улица">🔥 90-е и Улица</option>
<option value="Криминал">🔫 Криминал</option>
</select>
<input id="mMeta" required placeholder="2026 • Драма, Криминал" class="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-xs">
<input id="mEpName" required value="1 серия" placeholder="Название серии" class="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-xs">
<input id="mUrl" required type="url" placeholder="Ссылка на YouTube или .mp4" class="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-xs">
<textarea id="mDesc" placeholder="Описание..." class="sm:col-span-2 bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-xs"></textarea>
<button type="submit" class="sm:col-span-2 bg-red-600 font-bold py-2.5 rounded-xl text-xs">🚀 Опубликовать</button>
</form>

<div id="tab-list" class="hidden space-y-2">
<button onclick="hardReset()" class="text-xs bg-red-950 text-red-300 px-3 py-1.5 rounded-lg border border-red-500/30">♻️ Сбросить базу к стандартной</button>
<div id="adminList" class="space-y-2 max-h-80 overflow-y-auto"></div>
</div>

<div id="tab-staff" class="hidden space-y-4">
<div class="bg-black/30 p-4 rounded-xl border border-white/10 space-y-3">
<h4 class="text-xs font-bold uppercase text-amber-400">Выдать доступ сотруднику (Админ / Модератор)</h4>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
<input id="staffName" placeholder="Никнейм (напр. Саня_Модер)" class="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-xs">
<select id="staffRole" class="bg-[#1a1d28] border border-white/10 rounded-lg px-3 py-2 text-xs">
